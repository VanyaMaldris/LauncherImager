<!DOCTYPE html>
<html>
<head>
<style>
body {
    background: #482e1b;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
}
</style>
</head>

<body>

<img id="slider" src="image1.png">

<script>
let images = [
    "image1.png",
    "image2.png",
    "image3.png",
    "image4.png",
    "image5.png",
    "image6.png",
    "image7.png",
];

let index = 0;

setInterval(() => {
    index = (index + 1) % images.length;
    document.getElementById("slider").src = images[index];
}, 5000);
</script>

</body>
</html>
